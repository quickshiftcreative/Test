<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Admin Dashboard | OG Dask CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #09090b; color: #f4f4f5; }
    .bento-panel { background: #121215; border: 1px solid #27272a; }
    input, textarea, select { background: #09090b !important; border: 1px solid #27272a !important; color: #fff !important; }
  </style>
</head>
<body class="min-h-screen">

  <!-- LOGIN GATE -->
  <div id="login-gate" class="fixed inset-0 z-50 bg-[#09090b] flex items-center justify-center p-4">
    <div class="bento-panel rounded-3xl max-w-sm w-full p-8 text-center shadow-2xl">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 mx-auto flex items-center justify-center text-xl font-bold mb-4">🔐</div>
      <h2 class="text-xl font-bold text-white">Private Admin Control</h2>
      <p class="text-xs text-zinc-400 mt-1">Default PIN: <code class="text-emerald-400">admin123</code></p>
      <form onsubmit="handleLogin(event)" class="mt-6 space-y-4">
        <input type="password" id="admin-pin" required placeholder="Enter Password" class="w-full px-4 py-3 rounded-xl text-sm text-center" />
        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm text-white">
          Unlock Dashboard →
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN CONTROL INTERFACE -->
  <div class="max-w-7xl mx-auto px-4 py-8 space-y-6">
    <div class="bento-panel rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
      <div>
        <span class="text-[10px] font-extrabold uppercase text-emerald-400">Secure Backend</span>
        <h1 class="text-xl font-bold text-white">⚡ OG Dask Admin CMS</h1>
      </div>
      <div class="flex gap-2">
        <button onclick="loadSampleData()" class="px-3 py-2 rounded-xl bg-amber-500/20 text-amber-300 text-xs font-bold">✨ Load Demo Data</button>
        <a href="index.html" target="_blank" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">🌐 View Website ↗</a>
      </div>
    </div>

    <!-- Admin Tabs -->
    <div class="flex flex-wrap gap-2">
      <button onclick="switchTab('t-brand')" class="adm-tab px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white">1. Brand & USD Rate</button>
      <button onclick="switchTab('t-services')" class="adm-tab px-3.5 py-2 rounded-xl text-xs font-bold bento-panel text-zinc-300">2. Services & Sub-Services</button>
      <button onclick="switchTab('t-tracker')" class="adm-tab px-3.5 py-2 rounded-xl text-xs font-bold bento-panel text-zinc-300">3. Live Tracker (0-100%)</button>
      <button onclick="switchTab('t-portfolio')" class="adm-tab px-3.5 py-2 rounded-xl text-xs font-bold bento-panel text-zinc-300">4. Portfolio</button>
      <button onclick="switchTab('t-team')" class="adm-tab px-3.5 py-2 rounded-xl text-xs font-bold bento-panel text-zinc-300">5. About & Team</button>
    </div>

    <!-- TAB 1: BRAND -->
    <div id="t-brand" class="adm-pane bento-panel rounded-3xl p-6 space-y-4">
      <h2 class="text-lg font-bold text-white border-b border-[#27272a] pb-3">Brand & Currency Exchange Rate</h2>
      <form onsubmit="saveBrand(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div><label class="text-xs text-zinc-400 block mb-1">Agency Name</label><input type="text" id="b-name" class="w-full px-3 py-2 rounded-xl text-sm" /></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Tagline</label><input type="text" id="b-tag" class="w-full px-3 py-2 rounded-xl text-sm" /></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Domain</label><input type="text" id="b-dom" class="w-full px-3 py-2 rounded-xl text-sm" /></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Phone / WhatsApp</label><input type="text" id="b-phone" class="w-full px-3 py-2 rounded-xl text-sm" /></div>
        <div><label class="text-xs text-zinc-400 block mb-1">Email</label><input type="text" id="b-email" class="w-full px-3 py-2 rounded-xl text-sm" /></div>
        <div><label class="text-xs text-zinc-400 block mb-1">USD Exchange Rate ($1 = ₹X)</label><input type="number" id="b-usd" class="w-full px-3 py-2 rounded-xl text-sm" /></div>
        <button type="submit" class="md:col-span-3 py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm">Save Settings</button>
      </form>
    </div>

    <!-- TAB 2: SERVICES -->
    <div id="t-services" class="adm-pane bento-panel rounded-3xl p-6 hidden space-y-6">
      <h2 class="text-lg font-bold text-white border-b border-[#27272a] pb-3">Add Core Service & Sub-Services</h2>
      <form onsubmit="addService(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="s-title" required placeholder="Service Title" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="s-cat" required placeholder="Category (e.g. E-Commerce)" class="px-3 py-2 rounded-xl text-sm" />
        <input type="number" id="s-inr" required placeholder="Price in ₹ INR" class="px-3 py-2 rounded-xl text-sm" />
        <input type="number" id="s-usd" required placeholder="Price in $ USD" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="s-summary" required placeholder="Short summary" class="md:col-span-2 px-3 py-2 rounded-xl text-sm" />
        <textarea id="s-subs" required rows="2" placeholder="Sub-services (comma separated: A+ Design, PPC, Audit)" class="md:col-span-2 px-3 py-2 rounded-xl text-sm"></textarea>
        <button type="submit" class="md:col-span-2 py-3 rounded-xl bg-emerald-500 text-slate-950 font-bold text-sm">+ Add Service</button>
      </form>
      <div id="adm-services-list" class="space-y-3 pt-4"></div>
    </div>

    <!-- TAB 3: TRACKER -->
    <div id="t-tracker" class="adm-pane bento-panel rounded-3xl p-6 hidden space-y-6">
      <h2 class="text-lg font-bold text-white border-b border-[#27272a] pb-3">Client Progress Slider (0% - 100%)</h2>
      <form onsubmit="addProject(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="text" id="p-client" required placeholder="Client / Brand Name" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="p-name" required placeholder="Project Name" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="p-code" placeholder="Project ID (e.g. PRJ-101)" class="px-3 py-2 rounded-xl text-sm" />
        <select id="p-stage" class="px-3 py-2 rounded-xl text-sm"><option value="Onboarding">Onboarding</option><option value="Execution">Execution</option><option value="Completed">Completed</option></select>
        <div class="flex items-center gap-2 px-3 py-2 rounded-xl"><span class="text-xs text-zinc-400">Progress:</span><input type="range" id="p-prog" min="0" max="100" value="50" oninput="document.getElementById('p-lbl').innerText=this.value+'%'" class="flex-1" /><span id="p-lbl" class="text-xs font-bold text-emerald-400">50%</span></div>
        <input type="text" id="p-note" placeholder="Status note..." class="px-3 py-2 rounded-xl text-sm" />
        <button type="submit" class="md:col-span-3 py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm">+ Add Project</button>
      </form>
      <div id="adm-projects-list" class="space-y-3 pt-4"></div>
    </div>

    <!-- TAB 4: PORTFOLIO -->
    <div id="t-portfolio" class="adm-pane bento-panel rounded-3xl p-6 hidden space-y-4">
      <h2 class="text-lg font-bold text-white border-b border-[#27272a] pb-3">Upload Portfolio Case Study</h2>
      <form onsubmit="addPortfolio(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="pf-title" required placeholder="Project Title" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="pf-client" required placeholder="Client Brand" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="pf-cat" required placeholder="Category" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="pf-res" placeholder="Impact Result" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="pf-img" required placeholder="Image URL" class="md:col-span-2 px-3 py-2 rounded-xl text-sm" />
        <textarea id="pf-desc" required rows="2" placeholder="Description" class="md:col-span-2 px-3 py-2 rounded-xl text-sm"></textarea>
        <button type="submit" class="md:col-span-2 py-3 rounded-xl bg-purple-600 text-white font-bold text-sm">Publish Work</button>
      </form>
      <div id="adm-portfolio-list" class="space-y-3 pt-4"></div>
    </div>

    <!-- TAB 5: ABOUT & TEAM -->
    <div id="t-team" class="adm-pane bento-panel rounded-3xl p-6 hidden space-y-6">
      <h2 class="text-lg font-bold text-white border-b border-[#27272a] pb-3">Manage About Story & Team</h2>
      <form onsubmit="saveAbout(event)" class="space-y-3 border-b border-[#27272a] pb-4">
        <input type="text" id="ab-title" required placeholder="About Headline" class="w-full px-3 py-2 rounded-xl text-sm" />
        <textarea id="ab-story" required rows="3" placeholder="Agency Story..." class="w-full px-3 py-2 rounded-xl text-sm"></textarea>
        <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Save Story</button>
      </form>
      <form onsubmit="addTeam(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <input type="text" id="tm-name" required placeholder="Full Name" class="px-3 py-2 rounded-xl text-sm" />
        <input type="text" id="tm-des" required placeholder="Designation" class="px-3 py-2 rounded-xl text-sm" />
        <select id="tm-grp" class="px-3 py-2 rounded-xl text-sm"><option value="Partner">Partner</option><option value="Staff">Staff</option></select>
        <input type="text" id="tm-photo" placeholder="Photo URL" class="px-3 py-2 rounded-xl text-sm" />
        <button type="submit" class="md:col-span-4 py-3 rounded-xl bg-emerald-500 text-slate-950 font-bold text-sm">+ Add Member</button>
      </form>
      <div id="adm-team-list" class="space-y-2 pt-4"></div>
    </div>
  </div>

  <script>
    const DB_KEY = 'OG_DASK_AGENCY_OS_V3';
    function getDB() { const s = localStorage.getItem(DB_KEY); return s ? JSON.parse(s) : {}; }
    function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); renderAdmin(); }
    function handleLogin(e) {
      e.preventDefault();
      if(document.getElementById('admin-pin').value === 'admin123') {
        document.getElementById('login-gate').classList.add('hidden');
        populateAdmin();
      } else { alert('Wrong password! Use admin123'); }
    }
    function switchTab(id) {
      document.querySelectorAll('.adm-pane').forEach(p => p.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }
    function populateAdmin() {
      const db = getDB();
      if(!db.brand) return;
      document.getElementById('b-name').value = db.brand.name;
      document.getElementById('b-tag').value = db.brand.tagline;
      document.getElementById('b-dom').value = db.brand.domain;
      document.getElementById('b-phone').value = db.brand.phone;
      document.getElementById('b-email').value = db.brand.email;
      document.getElementById('b-usd').value = db.brand.usdRate || 83;
      document.getElementById('ab-title').value = db.about.title;
      document.getElementById('ab-story').value = db.about.story;
      renderAdmin();
    }
    function saveBrand(e) {
      e.preventDefault();
      const db = getDB();
      db.brand.name = document.getElementById('b-name').value;
      db.brand.tagline = document.getElementById('b-tag').value;
      db.brand.domain = document.getElementById('b-dom').value;
      db.brand.phone = document.getElementById('b-phone').value;
      db.brand.email = document.getElementById('b-email').value;
      db.brand.usdRate = Number(document.getElementById('b-usd').value || 83);
      saveDB(db); alert('Saved!');
    }
    function addService(e) {
      e.preventDefault();
      const db = getDB();
      db.services.push({
        id: 'S-' + Date.now(),
        title: document.getElementById('s-title').value,
        category: document.getElementById('s-cat').value,
        priceINR: Number(document.getElementById('s-inr').value),
        priceUSD: Number(document.getElementById('s-usd').value),
        billing: 'Monthly',
        summary: document.getElementById('s-summary').value,
        subservices: document.getElementById('s-subs').value.split(',').map(x=>x.trim()).filter(Boolean)
      });
      saveDB(db); e.target.reset();
    }
    function addProject(e) {
      e.preventDefault();
      const db = getDB();
      db.projects.unshift({
        id: 'P-' + Date.now(),
        clientName: document.getElementById('p-client').value,
        projectName: document.getElementById('p-name').value,
        code: document.getElementById('p-code').value || 'PRJ-100',
        stage: document.getElementById('p-stage').value,
        progress: Number(document.getElementById('p-prog').value),
        note: document.getElementById('p-note').value
      });
      saveDB(db); e.target.reset();
    }
    function updateProjProg(id, val) {
      const db = getDB();
      const p = db.projects.find(x => x.id === id);
      if(p) { p.progress = Number(val); if(p.progress===100) p.stage='Completed'; saveDB(db); }
    }
    function addPortfolio(e) {
      e.preventDefault();
      const db = getDB();
      db.portfolio.unshift({
        id: 'PF-' + Date.now(),
        title: document.getElementById('pf-title').value,
        client: document.getElementById('pf-client').value,
        category: document.getElementById('pf-cat').value,
        result: document.getElementById('pf-res').value,
        media: document.getElementById('pf-img').value,
        desc: document.getElementById('pf-desc').value
      });
      saveDB(db); e.target.reset();
    }
    function saveAbout(e) {
      e.preventDefault();
      const db = getDB();
      db.about.title = document.getElementById('ab-title').value;
      db.about.story = document.getElementById('ab-story').value;
      saveDB(db); alert('About Saved!');
    }
    function addTeam(e) {
      e.preventDefault();
      const db = getDB();
      db.team.push({
        id: 'TM-' + Date.now(),
        name: document.getElementById('tm-name').value,
        designation: document.getElementById('tm-des').value,
        group: document.getElementById('tm-grp').value,
        photo: document.getElementById('tm-photo').value
      });
      saveDB(db); e.target.reset();
    }
    function removeItem(col, id) {
      const db = getDB();
      db[col] = db[col].filter(x => x.id !== id);
      saveDB(db);
    }
    function renderAdmin() {
      const db = getDB();
      document.getElementById('adm-services-list').innerHTML = (db.services||[]).map(s=>`
        <div class="p-3 rounded-xl bg-[#09090b] flex justify-between items-center text-xs">
          <div><strong>${s.title}</strong> (₹${s.priceINR} / $${s.priceUSD})</div>
          <button onclick="removeItem('services','${s.id}')" class="text-rose-400 font-bold">Delete</button>
        </div>
      `).join('');
      document.getElementById('adm-projects-list').innerHTML = (db.projects||[]).map(p=>`
        <div class="p-3 rounded-xl bg-[#09090b] flex items-center justify-between gap-4 text-xs">
          <div><strong>${p.clientName}</strong> — ${p.projectName}</div>
          <div class="flex items-center gap-2"><input type="range" min="0" max="100" value="${p.progress}" onchange="updateProjProg('${p.id}',this.value)"><span class="text-emerald-400 font-bold">${p.progress}%</span><button onclick="removeItem('projects','${p.id}')" class="text-rose-400">Del</button></div>
        </div>
      `).join('');
      document.getElementById('adm-portfolio-list').innerHTML = (db.portfolio||[]).map(pf=>`
        <div class="p-3 rounded-xl bg-[#09090b] flex justify-between items-center text-xs">
          <div><strong>${pf.title}</strong> (${pf.client})</div>
          <button onclick="removeItem('portfolio','${pf.id}')" class="text-rose-400">Delete</button>
        </div>
      `).join('');
      document.getElementById('adm-team-list').innerHTML = (db.team||[]).map(t=>`
        <div class="p-3 rounded-xl bg-[#09090b] flex justify-between items-center text-xs">
          <div><strong>${t.name}</strong> [${t.group}]</div>
          <button onclick="removeItem('team','${t.id}')" class="text-rose-400">Remove</button>
        </div>
      `).join('');
    }
    function loadSampleData() {
      localStorage.setItem(DB_KEY, JSON.stringify({
        brand: { name: 'OG Dask', tagline: 'Global Digital Agency', domain: 'ogdask.com', phone: '+91 98765 43210', email: 'hello@ogdask.com', usdRate: 83 },
        seo: { title: 'Global Agency', desc: '', keys: '' },
        about: { title: 'Built by Operators', story: 'We scale brands globally.', mission: '', vision: '' },
        services: [
          { id: 'S-1', title: 'Complete Marketplace Management', category: 'E-Commerce', priceINR: 15000, priceUSD: 180, billing: 'Monthly', summary: 'End-to-end Amazon & Flipkart scaling.', subservices: ['A+ Content', 'PPC Ads', 'Listing SEO'] }
        ],
        projects: [{ id: 'P-1', clientName: 'Hombria', projectName: 'Scaling', code: 'PRJ-101', stage: 'Execution', progress: 70, note: 'Live' }],
        portfolio: [{ id: 'PF-1', title: 'Launch', client: 'Brand', category: 'E-Commerce', result: '+200%', media: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80', desc: 'Scaling.' }],
        team: [{ id: 'TM-1', name: 'Jenish Kamli', designation: 'Founder', group: 'Partner', photo: '', bio: '' }],
        reviews: []
      }));
      populateAdmin(); alert('Demo data loaded!');
    }
  </script>
</body>
</html>
